# SPDX-License-Identifier: Apache-2.0
#
# One repo per plugin: the HashiCorp Vault secret plugin on the secret kind's memory ABI, as a
# same-repo Cargo workspace — the logic and its door (secret-vault, crate busbar-secret-vault, the
# rlib a busbar build links) and the thin cdylib that exports the same door dropped in
# (secret-vault-plugin, crate busbar-secret-vault-plugin).
#
# Its one busbar dependency is busbar-contract (#40), plus busbar-plugin-loader dev-only for the
# conformance test — `git` dependencies on GetBusbar/busbar pinned to the rev in `.busbar-ref`
# field 1. No sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "secret-vault",
    "secret-vault-plugin",
]
