# SPDX-License-Identifier: Apache-2.0
#
# This repo brings 100% of what it needs: the real HashiCorp Vault KV v2 client logic
# (hashicorp-vault, crate busbar-hashicorp-vault) and the thin dlopen ABI adapter that packages it as a
# busbar plugin (hashicorp-vault-plugin, crate busbar-hashicorp-vault-plugin) both live here, as a
# same-repo Cargo workspace — not split across this repo and busbarAI. Only busbar-api/
# busbar-plugin-sdk (and, for the adapter's dev-dependencies, busbar-plugin-loader/
# busbar-plugin-abi) still reach into a sibling busbarAI checkout, since those are core-engine
# contracts every plugin depends on the same way. Mirrors GetBusbar/auth-oidc's same-repo
# workspace layout exactly.
[workspace]
resolver = "2"
members = [
    "hashicorp-vault",
    "hashicorp-vault-plugin",
]
