# RENDERED by `busbar-release plugin sync busbar-secret-vault` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. Daily: does the newest
# PUBLISHED release still work for a user (busbar's plugin-consumer-verify.yml)? A publish-time check
# cannot see an artifact that rots afterwards; release.yml verifies each release as it publishes.
name: consumer-verify

on:
  schedule:
    - cron: "31 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify. Empty = the newest published release."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  consumer:
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@af1919aa7ba2404b0463c241e1c4324f36c61e9e
    with:
      version: ${{ inputs.version || '' }}
      asset_prefix: busbar-secret-vault
      plugin_name: busbar-secret-vault
      plugin_alias: vault
      plugin_kind: secret
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
