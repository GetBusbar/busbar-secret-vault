# RENDERED by `busbar-release plugin heal busbar-secret-vault` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. Weekly: does the newest
# PUBLISHED release still work for a user (busbar's plugin-consumer-verify.yml)? A publish-time check
# cannot see an artifact that rots afterwards; release.yml verifies each release as it publishes.
name: consumer-verify

on:
  schedule:
    - cron: "31 9 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify. Empty = the newest published release."
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  consumer:
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@1b5b47525d9c13e6ea823cae17c2723b156713be
    with:
      version: ${{ inputs.version || '' }}
      asset_prefix: busbar-secret-vault
      plugin_name: busbar-secret-vault
      plugin_alias: vault
      plugin_kind: secret
      bundle_image: ""
      bundle_env: ""
