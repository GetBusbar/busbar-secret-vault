# RENDERED by `cargo xtask fleet render busbar-secret-vault` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. The CI itself is
# busbar's plugin-ci.yml, taken at the busbar commit this repo pins (.busbar-ref).
name: ci

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@23d8a6b46deb158839df8bc02115b09023633040
    with:
      service: vault
      busbar_checkout: false
      macos_test: "cargo test --workspace --locked --lib --test conformance -- --skip roundtrip_against_live_vault"
      extra_test: ""
      plugin_crate: busbar-secret-vault-plugin
      plugin_kind: secret
      plugin_alias: vault
    secrets: inherit
