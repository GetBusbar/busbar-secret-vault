# RENDERED by `busbar-release plugin sync busbar-secret-vault` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. THIS REPO TESTS ITSELF AGAINST BUSBAR with the fleet's ONE
# harness: busbar's reusable plugin-ci.yml, taken at the busbar commit this repo pins (.busbar-ref), so
# the CI logic, the gates (busbar scripts/fleet/plugin-gates.py), the dependency policy
# (.github/fleet/deps.toml) and the contract move together (OWNER 2026-10-02). No CI logic lives here.
name: ci

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch: {}
  # release.yml runs this file on the tagged commit before it publishes.
  workflow_call: {}

permissions:
  contents: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@af1919aa7ba2404b0463c241e1c4324f36c61e9e
    with:
      service: vault
      busbar_checkout: false
      macos_test: "cargo test --workspace --locked --lib --test conformance -- --skip roundtrip_against_live_vault"
      extra_test: ""
      plugin_crate: busbar-secret-vault-plugin
      plugin_kind: secret
      plugin_alias: vault
    secrets: inherit
