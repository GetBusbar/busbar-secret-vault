# RENDERED by `cargo xtask fleet render busbar-secret-vault` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. On a v* tag: this
# repo's CI on the tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then
# the consumer verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    tags: ["v*", "!v*-*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@7a5b429041752e00375e120ab1547a8928c3dee4
    with:
      service: vault
      busbar_checkout: false
      macos_test: "cargo test --workspace --locked --lib --test conformance -- --skip roundtrip_against_live_vault"
      extra_test: ""
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@7a5b429041752e00375e120ab1547a8928c3dee4
    with:
      plugin_crate: busbar-hashicorp-vault-plugin
      manifest_name: busbar-hashicorp-vault
      plugin_alias: vault
      plugin_kind: secret
      asset_prefix: busbar-hashicorp-vault
      description: "The HashiCorp Vault secret backend as a droppable busbar plugin: a cdylib exporting the secret C ABI. Drop it in the plugins folder, add vault to secrets: with its addr/token settings, and reference secrets as { module: vault, settings: { path: \"kv/data/name#field\" } }."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "hashicorp-vault/declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@7a5b429041752e00375e120ab1547a8928c3dee4
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-hashicorp-vault
      plugin_name: busbar-hashicorp-vault
      plugin_alias: vault
      plugin_kind: secret
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
