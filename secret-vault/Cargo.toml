# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-secret-vault"
version = "1.0.0"
publish = false            # linked into busbar at a pinned rev, or shipped as a signed tarball; never to crates.io
edition = "2021"
rust-version = "1.97"
description = "The HashiCorp Vault backend for busbar's kind:secret plugin on the secret kind's memory ABI: reads a field out of a Vault KV v2 secret through the host's http exchange, authenticating with the kernel-resolved X-Vault-Token."
license = "Apache-2.0"

[lib]
# rlib only: the logic and its door. A build that LINKS this crate registers `door::door` as its
# row (no symbol is exported from here); the dropped-in cdylib is `busbar-secret-vault-plugin`
# (same repo), which exports the same door as `busbar_plugin_door`.
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only), pinned by git rev to `.busbar-ref`.
busbar-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The status rendering 1.5.5's errors printed ("503 Service Unavailable"): the same `http` crate
# 1.5.5's client rendered it with. No I/O: the plugin never opens a socket (THE DESIGN §5).
http = { workspace = true }

[dev-dependencies]
# The live-Vault test's stand-in for the host's framed exchange: a real HTTP client, test-only,
# never in the plugin's closure.
reqwest = { workspace = true, features = ["blocking"] }
