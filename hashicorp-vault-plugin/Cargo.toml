# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-hashicorp-vault-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The HashiCorp Vault secret backend as a droppable busbar plugin — a cdylib exporting the secret C ABI. Drop it in the plugins folder, add secrets.<alias>.settings: { addr, token }, and reference secrets as { module: <alias>, settings: { path: \"kv/data/name#field\" } }."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib for the C ABI delivery; rlib so the unit tests / e2e test can exercise it as a normal crate too

[dependencies]
# busbar-hashicorp-vault is now a SAME-REPO sibling crate (this plugin brings 100% of what it needs —
# the real logic lives here, not in busbar). Only busbar-api/busbar-plugin-sdk still reach into
# busbar — INTERIM local path dependencies into a sibling checkout, since busbar isn't public
# yet; once it ships publicly these become git (pinned rev/tag) or crates.io dependencies instead.
busbar-api = { path = "../../busbar/crates/api" }
busbar-plugin-sdk = { path = "../../busbar/crates/plugin-sdk" }
busbar-hashicorp-vault = { path = "../hashicorp-vault" }
serde_json = "1"

[dev-dependencies]
# INTERIM local path deps into busbar, same rationale as above — these are dev-only. The
# end-to-end test loads the built cdylib over the real loader ABI seam and seeds/reads a secret
# against a real Vault dev-mode server, so `busbar-hashicorp-vault`'s own HTTP client does a genuine
# round trip rather than a stub.
busbar-plugin-loader = { path = "../../busbar/crates/plugin-loader" }
# Same reqwest 0.12 major + blocking client shape busbar-hashicorp-vault's own client uses — the e2e
# test's setup step seeds a secret into Vault via a raw HTTP PUT before reading it back through the
# dlopen'd plugin.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde_json = "1"
