# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-secret-vault-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The HashiCorp Vault secret backend as a droppable busbar plugin: a cdylib exporting the secret kind's door. Drop it in the plugins folder, add secrets.<alias>.settings: { addr, token }, and reference secrets as { module: <alias>, settings: { path: \"kv/data/name#field\" } }."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door, exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what the conformance test depends on to have the cdylib built.
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `door::door` is the door this image exports.
busbar-secret-vault = { path = "../secret-vault" }
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767" }

[dev-dependencies]
# The conformance test loads the built cdylib and the linked door over the REAL loader — dev-only,
# never in the shipped artifact. Same pinned rev, so one busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767" }
serde_json = "1"
