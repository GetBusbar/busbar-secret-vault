# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-secret-vault-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The HashiCorp Vault secret backend as a droppable busbar plugin: a cdylib exporting the secret kind's door. Drop it in the plugins folder, add secrets.<alias>.settings: { addr, token }, and reference secrets as { module: <alias>, settings: { path: \"kv/data/name#field\" } }."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door, exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what the conformance test depends on to have the cdylib built.
crate-type = ["cdylib", "rlib"]

[features]
# THE DROPPED-IN DOOR: `export_door!` emits the one C symbol `busbar_plugin_door`, and ONLY the
# dropped-in cdylib may export it (compiled in = dropped in, one table: a busbar build that links
# this crate as a row, alone or beside others, must carry no door symbol, or two doors in one
# binary multiply define it under `lto = "fat"`). OFF by default; the dropped-in artifact is built
# `cargo build --release -p busbar-secret-vault-plugin --features dropped-in`, and `cargo test` names this crate
# below with it on so the cdylib the conformance test opens carries the door.
dropped-in = []

[dependencies]
# THE LOGIC, same repo: its `door::door` is the door this image exports.
busbar-secret-vault = { path = "../secret-vault" }
busbar-contract = { workspace = true }

[dev-dependencies]
# The conformance test opens this crate's own cdylib WITH its dropped-in door on (see `[features]`).
busbar-secret-vault-plugin = { path = ".", features = ["dropped-in"] }
# The conformance test loads the built cdylib and the linked door over the REAL loader — dev-only,
# never in the shipped artifact. Same pinned rev, so one busbar source resolves.
busbar-plugin-loader = { workspace = true, features = ["conformance"] }
busbar-contract = { workspace = true }
# THE SUITE'S HOST CONNECTOR (tests/support/conformance_host.rs, rendered by the fleet template for a
# repo whose declares state network needs): busbar's connector and its TLS test kit, and the
# framers the plugin's need names. Dev-only.
busbar-core-connector = { workspace = true }
busbar-transport-tcp = { workspace = true }
busbar-transport-http = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
serde_json = { workspace = true }
